name: Generate iPhone icon PNG
on:
  workflow_dispatch:
  push:
    paths:
      - 'eryri-icon.svg'
      - '.github/workflows/build-icon.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render Home Screen PNG icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              cairosvg.svg2png(url="eryri-icon.svg", write_to=f"eryri-icon-{size}.png", output_width=size, output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eryri-icon-180.png eryri-icon-192.png eryri-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG Home Screen icons"
            git push
          fi
